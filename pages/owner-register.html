<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Register | Perfect Space</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="logo">Perfect<span>Space</span></a>
  <div class="nav-links"><a href="../index.html">Home</a><a href="owner-login.html">Owner Login</a></div>
</div></nav>

<div class="form-wrapper">
  <h2>List Your Property</h2>
  <p class="form-subtitle">Register as an owner to add and manage your properties.</p>
  <form action="owner-login.html" method="get">
    <div class="form-group"><label>Full Name</label><input type="text" placeholder="Enter your full name" required></div>
    <div class="form-group"><label>Email Address</label><input type="email" placeholder="owner@example.com" required></div>
    <div class="form-group"><label>Phone Number</label><input type="tel" placeholder="10-digit mobile number" required></div>
    <div class="form-group"><label>Password</label><input type="password" placeholder="Create a password" required></div>
    <button type="submit" class="btn btn-primary btn-block">Register</button>
  </form>
  <p class="form-footer-text">Already registered? <a href="owner-login.html">Login here</a></p>
</div>

<footer><div class="container"><div class="footer-bottom">&copy; 2026 Perfect Space. All rights reserved.</div></div></footer>
</body></html>
