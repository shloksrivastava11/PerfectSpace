<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Property | Perfect Space</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/owner.css">
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="logo">Perfect<span>Space</span></a>
  <div class="nav-links"><span style="font-weight:600; color:var(--dark-green);">Owner Panel</span>
    <div class="nav-actions"><a href="../index.html" class="btn btn-outline btn-sm">Logout</a></div>
  </div>
</div></nav>

<div class="owner-layout">
  <aside class="sidebar">
    <div class="sidebar-title">Owner Menu</div>
    <ul>
      <li><a href="owner-dashboard.html">Dashboard</a></li>
      <li><a href="my-properties.html">My Properties</a></li>
      <li><a href="add-property.html" class="active">Add Property</a></li>
      <li><a href="add-room.html">Rooms</a></li>
      <li><a href="availability.html">Availability</a></li>
      <li><a href="booking-requests.html">Booking Requests</a></li>
      <li><a href="owner-reviews.html">Reviews</a></li>
      <li><a href="property-analytics.html">Analytics</a></li>
      <li><a href="owner-profile.html">Profile</a></li>
      <li><a href="../index.html">Logout</a></li>
    </ul>
  </aside>

  <main class="dashboard-main">
    <div class="dashboard-topbar"><h1>Add New Property</h1></div>
    <div class="panel">
      <form action="my-properties.html" method="get">
        <div class="form-row">
          <div class="form-group"><label>Property Name</label><input type="text" placeholder="e.g. Green Nest PG" required></div>
          <div class="form-group"><label>Property Type</label>
            <select required><option>PG</option><option>Single Room</option><option>Shared Room</option><option>Flat</option></select>
          </div>
        </div>
        <div class="form-group"><label>Address</label><input type="text" placeholder="Street, Area" required></div>
        <div class="form-row">
          <div class="form-group"><label>City</label><input type="text" placeholder="e.g. Meerut" required></div>
          <div class="form-group"><label>Contact Information</label><input type="tel" placeholder="Contact number" required></div>
        </div>
        <div class="form-group"><label>Description</label><textarea placeholder="Describe your property"></textarea></div>
        <div class="form-group"><label>Facilities</label><input type="text" placeholder="e.g. WiFi, AC, Food, Laundry (comma separated)"></div>
        <div class="form-group">
          <label>Upload Property Photos</label>
          <div class="upload-box">📷 Drag & drop photos here or click to browse<br><input type="file" multiple accept="image/*" style="margin-top:12px;"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Add Property</button>
      </form>
    </div>
  </main>
</div>
</body></html>
