<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Perfect Space</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="admin-login-wrapper">
  <div class="admin-login-card">
    <h2>Perfect Space Admin</h2>
    <p>Sign in to access the platform administration panel.</p>
    <form action="admin-dashboard.html" method="get">
      <div class="form-group"><label>Admin Email</label><input type="email" placeholder="admin@perfectspace.com" required></div>
      <div class="form-group"><label>Password</label><input type="password" placeholder="Enter admin password" required></div>
      <button type="submit" class="btn btn-primary btn-block">Login to Dashboard</button>
    </form>
    <p class="form-footer-text mt-20"><a href="../index.html">&larr; Back to Perfect Space Home</a></p>
  </div>
</div>

</body></html>
